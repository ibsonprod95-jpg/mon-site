@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e1a13;--surface:#16271c;--text:#e8f2eb;--muted:#9bb2a3;--line:#274433;--brand:#1fb5ae;--brand-dark:#14948e;color-scheme:dark}
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--brand);color:#fff;border-bottom:6px solid var(--accent);padding:18px 20px}
header h1{margin:0;font-size:1.25rem;line-height:1.25}
header p{margin:4px 0 0;opacity:.9;font-size:.9rem}
main{max-width:1000px;margin:0 auto;padding:20px;display:grid;gap:20px;grid-template-columns:1fr 1fr}
@media(max-width:760px){main{grid-template-columns:1fr}}
section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
h2{margin:0 0 14px;font-size:1.05rem;color:var(--brand)}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
textarea{min-height:80px;resize:vertical}
button{font:inherit;font-weight:700;border:0;border-radius:6px;padding:12px 18px;cursor:pointer;background:var(--brand);color:#fff;width:100%;margin-top:16px}
button:hover{background:var(--brand-dark)}
button.alt{background:var(--accent);color:#2b2200}
.fiche{border:2px solid var(--brand);border-radius:8px;overflow:hidden}
.fiche-head{background:var(--brand);color:#fff;padding:10px 14px;border-bottom:4px solid var(--accent);font-weight:700}
.fiche-body{padding:14px}
.photo{width:100%;aspect-ratio:4/3;background:var(--bg);border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.9rem;overflow:hidden;margin-bottom:12px}
.photo img{width:100%;height:100%;object-fit:contain}
dl{margin:0;display:grid;grid-template-columns:110px 1fr;gap:6px 10px}
dt{color:var(--muted);font-size:.9rem}
dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.ref{margin-top:12px;font-size:.85rem;color:var(--muted)}
@media print{
  body{background:#fff;color:#000}
  header,form-section,.noprint{display:none!important}
  main{display:block;padding:0}
  .fiche-section{border:0;padding:0}
  .fiche-section h2{display:none}
  .fiche-head{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

.logo{display:inline-block;width:52px;height:52px;flex:none;background:var(--logo) center/contain no-repeat;border-radius:10px}
.logo.sm{width:34px;height:34px;border-radius:7px}
header .bar{display:flex;align-items:center;gap:14px;max-width:1000px;margin:0 auto}
.fiche-head{display:flex;align-items:center;gap:10px}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--logo) 0 0/110px 110px repeat;opacity:.06;pointer-events:none}
@media print{body::before{display:none}}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
label.cam{display:block;text-align:center;margin-top:8px;padding:11px 14px;border:2px solid var(--brand);border-radius:6px;color:var(--brand);font-weight:700;cursor:pointer}
label.cam:hover{background:var(--brand);color:#fff}
label.cam:has(+ .sr:focus-visible){outline:3px solid var(--accent);outline-offset:1px}
.photo.ticket{aspect-ratio:auto;min-height:70px;max-height:260px}
.photo.ticket img{height:auto;max-height:260px}
</style>
</head>
<body>
<header>
  <div class="bar"><span class="logo" role="img" aria-label="Logo Dem Dikk"></span>
  <div><h1>Objets et bagages perdus</h1>
  <p>AIBD · Dem Dikk SA</p></div></div>
</header>
<main>
  <section class="noprint">
    <h2>Déclarer un bagage</h2>
    <label for="nom">Nom du propriétaire</label>
    <input id="nom" autocomplete="name">
    <label for="tel">Téléphone</label>
    <input id="tel" type="tel" autocomplete="tel">
    <label for="desc">Description du bagage</label>
    <textarea id="desc" placeholder="Couleur, taille, marque, signes distinctifs"></textarea>
    <label for="lieu">Lieu et date de la perte</label>
    <input id="lieu" placeholder="Ex. : Terminal AIBD, bus ligne 1, 27/10/2026">
    <label for="tkt">Numéro du bus</label>
    <input id="tkt" inputmode="text" placeholder="Numéro inscrit sur le bus">
    <label for="photo">Photo du bagage</label>
    <input id="photo" type="file" accept="image/*">
    <label class="cam" for="photo-cam">Prendre une photo du bagage</label>
    <input id="photo-cam" class="sr" type="file" accept="image/*" capture="environment">
    <label for="ticket">Importer le ticket de bus acheté</label>
    <input id="ticket" type="file" accept="image/*">
    <label class="cam" for="ticket-cam">Prendre une photo du ticket</label>
    <input id="ticket-cam" class="sr" type="file" accept="image/*" capture="environment">
    <button type="button" id="exp" class="alt">Exporter la fiche en PDF</button>
  </section>

  <section class="fiche-section">
    <h2>Fiche du propriétaire</h2>
    <div class="fiche">
      <div class="fiche-head"><span class="logo sm" role="img" aria-label="Logo Dem Dikk"></span>Objets et bagages perdus – AIBD Dem Dikk SA</div>
      <div class="fiche-body">
        <div class="photo" id="ph">Aucune photo ajoutée</div>
        <div class="photo ticket" id="ph2">Aucun ticket importé</div>
        <dl>
          <dt>Propriétaire</dt><dd id="o-nom">—</dd>
          <dt>Téléphone</dt><dd id="o-tel">—</dd>
          <dt>Bagage</dt><dd id="o-desc">—</dd>
          <dt>Lieu et date</dt><dd id="o-lieu">—</dd>
          <dt>N° du bus</dt><dd id="o-tkt">—</dd>
        </dl>
        <div class="ref" id="ref"></div>
      </div>
    </div>
  </section>
</main>
<script>
(function(){
  var ids=["nom","tel","desc","lieu","tkt"];
  function maj(){
    ids.forEach(function(i){
      document.getElementById("o-"+i).textContent=document.getElementById(i).value.trim()||"—";
    });
  }
  ids.forEach(function(i){document.getElementById(i).addEventListener("input",maj)});
  document.getElementById("photo").addEventListener("change",function(e){
    var f=e.target.files&&e.target.files[0], ph=document.getElementById("ph");
    if(!f){ph.textContent="Aucune photo ajoutée";return}
    var r=new FileReader();
    r.onload=function(){var im=new Image();im.alt="Photo du bagage";im.src=r.result;ph.textContent="";ph.appendChild(im)};
    r.readAsDataURL(f);
  });
  [["photo-cam","ph"],["ticket-cam","ph2"]].forEach(function(c){
    document.getElementById(c[0]).addEventListener("change",function(e){
      var f=e.target.files&&e.target.files[0], ph=document.getElementById(c[1]);
      if(!f)return;
      var r=new FileReader();
      r.onload=function(){var im=new Image();im.alt="Photo prise avec l'appareil";im.src=r.result;ph.textContent="";ph.appendChild(im)};
      r.readAsDataURL(f);
    });
  });
  document.getElementById("ticket").addEventListener("change",function(e){
    var f=e.target.files&&e.target.files[0], ph=document.getElementById("ph2");
    if(!f){ph.textContent="Aucun ticket importé";return}
    var r=new FileReader();
    r.onload=function(){var im=new Image();im.alt="Ticket de bus";im.src=r.result;ph.textContent="";ph.appendChild(im)};
    r.readAsDataURL(f);
  });
  document.getElementById("exp").addEventListener("click",function(){
    var d=new Date(), ref="Fiche n° "+d.getFullYear()+("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2)+"-"+Math.floor(1000+Math.random()*9000)+" · éditée le "+d.toLocaleDateString("fr-FR");
    document.getElementById("ref").textContent=ref;
    window.print();
  });
  maj();
})();
</script>
</body>
</html>
